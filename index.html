<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>English Daily</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#172033;--muted:#667085;--line:#e7eaf0;--white:#fff;
  --purple:#7c3aed;--blue:#2563eb;--pink:#ec4899;--green:#10b981;--orange:#f59e0b;
}
html{background:#f7f4ff}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;
  background:
    radial-gradient(circle at 8% 8%,rgba(250,204,21,.22),transparent 24%),
    radial-gradient(circle at 92% 10%,rgba(59,130,246,.20),transparent 28%),
    radial-gradient(circle at 15% 90%,rgba(236,72,153,.16),transparent 26%),
    linear-gradient(145deg,#fff8ee 0%,#f5f3ff 48%,#edf6ff 100%);
}
button,select,input{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:820px;margin:auto;padding:22px 16px 56px}
.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.brand h1{
  margin:0;font-size:31px;line-height:1;font-weight:950;letter-spacing:-.7px;
  background:linear-gradient(90deg,var(--purple),var(--blue),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px;font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{
  background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);
  border-radius:999px;padding:9px 12px;font-size:13px;font-weight:900;
  box-shadow:0 8px 22px rgba(37,42,61,.07);backdrop-filter:blur(10px)
}
.levelCard{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:linear-gradient(135deg,#5b21b6,#7c3aed 50%,#2563eb);
  color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:14px;
  box-shadow:0 14px 32px rgba(91,33,182,.2)
}
.levelBubble{
  width:50px;height:50px;border-radius:16px;display:grid;place-items:center;
  background:rgba(255,255,255,.18);font-weight:950;font-size:18px
}
.levelTitle{font-weight:950}.levelSub{font-size:12px;opacity:.82;margin-top:3px}
.levelProgress{height:8px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:8px}
.levelBar{height:100%;background:#fff;border-radius:99px;transition:.3s}
.levelXP{font-size:12px;font-weight:900;white-space:nowrap}
.card{
  position:relative;overflow:hidden;background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.95);border-radius:26px;padding:24px;
  box-shadow:0 20px 50px rgba(31,41,55,.10);backdrop-filter:blur(14px)
}
.card:before{
  content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-90px;
  background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(236,72,153,.12))
}
.card>*{position:relative;z-index:1}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.label{font-size:12px;color:var(--muted);font-weight:850;margin-bottom:7px}
select,input{
  width:100%;border:1px solid #dce2eb;background:#fff;color:var(--ink);
  border-radius:14px;padding:13px 14px;outline:none;box-shadow:0 3px 10px rgba(15,23,42,.03)
}
select:focus,input:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(129,140,248,.13)}
.goalRow{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:7px}
.goalText{font-size:12px;font-weight:850;color:var(--muted)}
.goalText b{color:var(--purple)}
.progress{height:11px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7,#ec4899);border-radius:99px;transition:.35s}
.promptBadge{
  display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;
  background:#f4f1ff;color:#6d28d9;font-size:12px;font-weight:900
}
.zh{font-size:27px;font-weight:950;line-height:1.5;letter-spacing:-.35px;margin:14px 0 18px;color:#111827}
.inputWrap{display:none;margin-bottom:12px}
.status{
  display:none;margin-bottom:12px;padding:11px 13px;border-radius:13px;font-size:13px;font-weight:800
}
.status.show{display:block}
.status.info{background:#eff6ff;color:#1d4ed8}
.status.warn{background:#fff7ed;color:#c2410c}
.status.good{background:#ecfdf5;color:#047857}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{
  border:0;border-radius:14px;padding:13px 15px;font-weight:900;cursor:pointer;
  transition:transform .15s,filter .15s,opacity .15s
}
button:active{transform:scale(.985)}
button:disabled{opacity:.52;cursor:not-allowed}
.btnListen{background:linear-gradient(135deg,#dbeafe,#e0e7ff);color:#1d4ed8}
.btnMic{background:linear-gradient(135deg,#ffe4e6,#fce7f3);color:#be123c}
.btnCheck{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.20)}
.btnAnswer{background:#f2f4f7;color:#475467}
.answer,.scoreBox{
  display:none;margin-top:16px;padding:17px;border-radius:18px;border:1px solid #e2e8f0
}
.answer.show,.scoreBox.show{display:block}
.answer{background:linear-gradient(135deg,#f8fafc,#eef2ff)}
.en{font-size:20px;line-height:1.55;font-weight:950;color:#312e81}
.tip{margin-top:7px;color:#64748b;font-size:13px;line-height:1.55}
.scoreBox{background:linear-gradient(135deg,#eff6ff,#faf5ff)}
.bigScore{
  font-size:38px;font-weight:950;line-height:1;
  background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.feedback{font-weight:950;margin:8px 0 5px}
.yours{color:#64748b;font-size:13px;line-height:1.5}
.next{
  width:100%;margin-top:17px;background:linear-gradient(135deg,#10b981,#22c55e);
  color:#fff;box-shadow:0 10px 20px rgba(16,185,129,.20)
}
.footer{margin-top:14px;color:#98a2b3;font-size:11px;line-height:1.6;text-align:center}
.collection{
  margin-top:18px;padding:19px;border-radius:24px;background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.96);box-shadow:0 16px 36px rgba(31,41,55,.08);backdrop-filter:blur(12px)
}
.collectionHead{display:flex;justify-content:space-between;gap:12px;align-items:center}
.collectionTitle{font-size:20px;font-weight:950}.collectionSub{font-size:12px;color:var(--muted);margin-top:3px}
.collection button{background:#f2f4f7;color:#475467;padding:10px 12px}
.unlockInfo{
  margin-top:11px;padding:12px 13px;border-radius:14px;background:linear-gradient(135deg,#fff7ed,#fef3c7);
  color:#9a3412;border:1px solid #fde68a;font-size:13px;font-weight:850
}
.gallery{display:none;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:11px;margin-top:12px}
.gallery.show{display:grid}
.artCard{
  background:#fff;border:1px solid #e4e7ec;border-radius:17px;padding:8px;text-align:center;
  box-shadow:0 7px 16px rgba(15,23,42,.06)
}
.artCard canvas{width:100%;aspect-ratio:1;border-radius:12px;display:block}
.artLabel{font-size:11px;font-weight:900;margin-top:6px;color:#475467}
@media(max-width:600px){
  .wrap{padding:18px 13px 40px}.hero{flex-direction:column}.stats{justify-content:flex-start}
  .card{padding:18px}.controls{grid-template-columns:1fr}.zh{font-size:23px}.buttons{grid-template-columns:1fr 1fr}
  .levelCard{grid-template-columns:auto 1fr}.levelXP{grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <h1>English Daily</h1>
      <p>A2～B1 實用會話 · 每天一點點，真的講得出口</p>
    </div>
    <div class="stats">
      <div class="pill">⭐ <span id="xp">0</span> XP</div>
      <div class="pill">🔥 <span id="streak">0</span> 連勝</div>
      <div class="pill">✅ 今日 <span id="today">0</span></div>
    </div>
  </header>

  <section class="levelCard">
    <div class="levelBubble">Lv.<span id="level">1</span></div>
    <div>
      <div class="levelTitle" id="levelName">Warm-up Learner</div>
      <div class="levelSub">累積 XP 升級，每 100 XP 解鎖收藏圖案</div>
      <div class="levelProgress"><div class="levelBar" id="levelBar"></div></div>
    </div>
    <div class="levelXP" id="levelXP">0 / 100 XP</div>
  </section>

  <main class="card">
    <div class="controls">
      <div>
        <div class="label">練習情境</div>
        <select id="category">
          <option value="all">🌈 全部日常會話</option>
          <option value="work">💼 工作</option>
          <option value="travel">✈️ 旅遊</option>
          <option value="food">🍜 吃飯</option>
          <option value="daily">💬 生活聊天</option>
          <option value="shopping">🛍️ 購物</option>
        </select>
      </div>
      <div>
        <div class="label">練習模式</div>
        <select id="mode">
          <option value="speak">🎤 口說練習</option>
          <option value="translate">⌨️ 中翻英</option>
        </select>
      </div>
    </div>

    <div class="goalRow">
      <div class="goalText">今日目標 <b><span id="goalNow">0</span>/10 題</b></div>
      <div class="goalText" id="goalMessage">今天也前進一點點</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="promptBadge" id="promptBadge">🎤 請說出英文</div>
    <div class="zh" id="question">載入中...</div>

    <div class="inputWrap" id="inputWrap">
      <input id="typed" autocomplete="off" autocapitalize="sentences" placeholder="在這裡輸入英文…">
    </div>

    <div class="status" id="status"></div>

    <div class="buttons">
      <button class="btnListen" id="listenBtn">🔊 聽參考發音</button>
      <button class="btnMic" id="micBtn">🎤 開始說</button>
      <button class="btnCheck" id="checkBtn">✨ 檢查答案</button>
      <button class="btnAnswer" id="showBtn">👀 看答案</button>
    </div>

    <div class="answer" id="answer">
      <div class="label">參考答案</div>
      <div class="en" id="answerText"></div>
      <div class="tip" id="tip"></div>
    </div>

    <div class="scoreBox" id="scoreBox">
      <div class="bigScore"><span id="score">0</span> 分</div>
      <div class="feedback" id="feedback"></div>
      <div class="yours">你的答案：<span id="yourText"></span></div>
      <div class="tip" id="xpGain"></div>
    </div>

    <button class="next" id="nextBtn">下一題 ➜</button>

    <div class="footer">
      口說分數目前依「語音辨識出的文字」與參考句相似度計算，不等同專業發音音素評測。
    </div>
  </main>

  <section class="collection">
    <div class="collectionHead">
      <div>
        <div class="collectionTitle">🎁 我的收藏</div>
        <div class="collectionSub">每 100 XP 解鎖一張專屬隨機圖案</div>
      </div>
      <button id="toggleGallery">查看收藏</button>
    </div>
    <div class="unlockInfo" id="unlockInfo"></div>
    <div class="gallery" id="gallery"></div>
  </section>
</div>

<script>
const questions = [
 {c:"work",zh:"我本來想早點下班，但臨時有事情要處理。",en:"I was going to leave work early, but something came up.",tip:"something came up = 臨時有事"},
 {c:"work",zh:"我還不確定，我晚一點再跟你確認。",en:"I'm not sure yet, but I'll check and let you know later.",tip:"let you know = 再告訴你 / 通知你"},
 {c:"work",zh:"你可以把這份資料寄給我嗎？",en:"Could you send me this information?",tip:"Could you... 比 Can you... 更客氣"},
 {c:"work",zh:"這件事情比我原本想的更久。",en:"This is taking longer than I expected.",tip:"than I expected = 比我預期的"},
 {c:"work",zh:"我們明天早上再討論這個問題。",en:"Let's talk about this again tomorrow morning.",tip:"Let's... = 我們一起…"},
 {c:"travel",zh:"如果班機延誤，我們可能會趕不上轉機。",en:"If the flight is delayed, we might miss our connection.",tip:"miss our connection = 趕不上轉機"},
 {c:"travel",zh:"請問從這裡到火車站大概要多久？",en:"How long does it take to get to the train station from here?",tip:"How long does it take... = 需要多久"},
 {c:"travel",zh:"我想要靠走道的座位，可以嗎？",en:"I'd like an aisle seat, if possible.",tip:"if possible = 如果可以的話"},
 {c:"travel",zh:"我們先把行李放到飯店，再出去吃飯。",en:"Let's drop off our luggage at the hotel before we go eat.",tip:"drop off = 放下 / 送到"},
 {c:"travel",zh:"這附近有沒有值得去的地方？",en:"Is there anywhere worth visiting around here?",tip:"worth visiting = 值得去看看"},
 {c:"food",zh:"我還沒決定要吃什麼。",en:"I haven't decided what to eat yet.",tip:"haven't decided yet = 還沒決定"},
 {c:"food",zh:"這道菜有點太辣了，但味道很好。",en:"This dish is a little too spicy, but it tastes really good.",tip:"a little too... = 有點太…"},
 {c:"food",zh:"我們可以先點一些東西一起吃。",en:"We can order a few things to share.",tip:"to share = 一起分著吃"},
 {c:"food",zh:"你有沒有推薦這間店必點的東西？",en:"Is there anything you recommend here?",tip:"recommend = 推薦"},
 {c:"daily",zh:"我已經等了快半個小時了。",en:"I've been waiting for almost half an hour.",tip:"I've been waiting... = 我已經等了一段時間"},
 {c:"daily",zh:"如果你明天有空，我們可以一起吃午餐。",en:"If you're free tomorrow, we can have lunch together.",tip:"If you're free... = 如果你有空"},
 {c:"daily",zh:"我本來要打給你，但是後來忘記了。",en:"I was going to call you, but I forgot.",tip:"was going to = 本來打算"},
 {c:"daily",zh:"我覺得今天比昨天熱很多。",en:"I think it's much hotter today than yesterday.",tip:"much hotter = 熱很多"},
 {c:"daily",zh:"你介意把冷氣調小一點嗎？",en:"Would you mind turning the air conditioning down a little?",tip:"Would you mind... = 你介意…嗎"},
 {c:"shopping",zh:"我只是看看，目前還不需要幫忙。",en:"I'm just looking, thanks. I don't need any help right now.",tip:"I'm just looking = 我只是看看"},
 {c:"shopping",zh:"如果尺寸不合，我可以拿回來換嗎？",en:"Can I bring it back if the size doesn't fit?",tip:"doesn't fit = 不合尺寸"},
 {c:"shopping",zh:"你們有沒有同款但是不同顏色的？",en:"Do you have the same one in a different color?",tip:"the same one = 同一款"}
];

const $ = id => document.getElementById(id);
const DAY_KEY = new Date().toLocaleDateString("en-CA");
const UNLOCK_STEP = 100;
const LEVEL_STEP = 100;
const LEVEL_NAMES = ["Warm-up Learner","Daily Speaker","Conversation Builder","Confident Talker","Fluent Explorer"];

let savedDay = localStorage.getItem("practiceDay");
let doneToday = savedDay === DAY_KEY ? Number(localStorage.getItem("doneToday") || 0) : 0;
if(savedDay !== DAY_KEY){
  localStorage.setItem("practiceDay", DAY_KEY);
  localStorage.setItem("doneToday", "0");
}
let xp = Number(localStorage.getItem("xp") || 0);
let streak = Number(localStorage.getItem("streak") || 0);
let unlockedArts;
try{ unlockedArts = JSON.parse(localStorage.getItem("unlockedArts") || "[]"); }
catch{ unlockedArts = []; }

let current = null;
let recognized = "";
let questionScored = false;
let lastQuestion = "";

function setStatus(message,type="info"){
  const el=$("status");
  if(!message){el.className="status";el.textContent="";return}
  el.textContent=message;el.className="status show "+type;
}
function updateUI(){
  $("xp").textContent=xp;
  $("streak").textContent=streak;
  $("today").textContent=doneToday;
  $("goalNow").textContent=Math.min(doneToday,10);
  $("bar").style.width=Math.min(100,doneToday/10*100)+"%";
  $("goalMessage").textContent=doneToday>=10?"🎉 今日目標完成！":"還差 "+Math.max(0,10-doneToday)+" 題完成今日目標";

  const level=Math.floor(xp/LEVEL_STEP)+1;
  const inside=xp%LEVEL_STEP;
  $("level").textContent=level;
  $("levelName").textContent=LEVEL_NAMES[Math.min(level-1,LEVEL_NAMES.length-1)];
  $("levelXP").textContent=inside+" / "+LEVEL_STEP+" XP";
  $("levelBar").style.width=inside+"%";
}
function normalize(s){
  return String(s||"").toLowerCase()
    .replace(/[’']/g,"'")
    .replace(/[^a-z0-9'\s]/g," ")
    .replace(/\bi am\b/g,"i'm")
    .replace(/\byou are\b/g,"you're")
    .replace(/\bi will\b/g,"i'll")
    .replace(/\bi have\b/g,"i've")
    .replace(/\bit is\b/g,"it's")
    .replace(/\s+/g," ").trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}
function scoreText(user,ans){
  const a=normalize(user),b=normalize(ans);
  if(!a)return 0;
  const charSim=1-levenshtein(a,b)/Math.max(a.length,b.length,1);
  const aw=new Set(a.split(" ")),bw=b.split(" ");
  const wordSim=bw.filter(w=>aw.has(w)).length/Math.max(bw.length,1);
  return Math.max(0,Math.min(100,Math.round((charSim*.55+wordSim*.45)*100)));
}
function newQuestion(){
  const cat=$("category").value;
  const pool=cat==="all"?questions:questions.filter(q=>q.c===cat);
  let next=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1){
    let guard=0;
    while(next.en===lastQuestion && guard<10){next=pool[Math.floor(Math.random()*pool.length)];guard++}
  }
  current=next;lastQuestion=next.en;recognized="";questionScored=false;
  $("question").textContent=current.zh;
  $("answerText").textContent=current.en;
  $("tip").textContent="💡 "+current.tip;
  $("typed").value="";
  $("answer").classList.remove("show");
  $("scoreBox").classList.remove("show");
  $("checkBtn").disabled=false;
  setStatus("");
}
function speak(){
  if(!current || !("speechSynthesis" in window)){
    setStatus("這個瀏覽器暫時無法播放語音。","warn");return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(current.en);
  u.lang="en-US";u.rate=.88;u.pitch=1;
  speechSynthesis.speak(u);
}
function evaluate(text){
  if(questionScored){
    setStatus("這題已經計分過了，請按「下一題」繼續。","info");return;
  }
  if(!String(text||"").trim()){
    setStatus($("mode").value==="speak"?"請先按「開始說」錄下你的英文。":"請先輸入你的英文答案。","warn");
    return;
  }
  const s=scoreText(text,current.en);
  $("score").textContent=s;
  $("yourText").textContent=text;
  $("answer").classList.add("show");
  $("scoreBox").classList.add("show");

  let feedback,gain=0;
  if(s>=90){feedback="Excellent! 很自然 🎉";gain=20}
  else if(s>=75){feedback="很好！意思和句型都很接近 👍";gain=10}
  else if(s>=55){feedback="意思接近，再試著把句型說完整一點 💪"}
  else{feedback="先聽一次參考句，再試一次會更容易 👂"}
  $("feedback").textContent=feedback;

  questionScored=true;
  $("checkBtn").disabled=true;

  if(s>=75){
    xp+=gain;streak+=1;doneToday+=1;
    $("xpGain").textContent="✨ 本題獲得 +"+gain+" XP";
    setStatus("答對了！已加入你的學習紀錄。","good");
  }else{
    streak=0;
    $("xpGain").textContent="這題先不加 XP，下一題再拿回來。";
  }

  localStorage.setItem("xp",String(xp));
  localStorage.setItem("streak",String(streak));
  localStorage.setItem("doneToday",String(doneToday));
  updateUI();
  syncUnlocks();
}
function applyMode(){
  const typing=$("mode").value==="translate";
  $("inputWrap").style.display=typing?"block":"none";
  $("micBtn").style.display=typing?"none":"block";
  $("promptBadge").textContent=typing?"⌨️ 請翻成英文":"🎤 請說出英文";
  setStatus("");
}
function seededRandom(seed){
  let s=seed%2147483647;if(s<=0)s+=2147483646;
  return()=> (s=s*16807%2147483647)/2147483647;
}
function createArt(seed){
  const rnd=seededRandom(seed);
  const palettes=[
    ["#111827","#f59e0b","#f8fafc","#ef4444"],
    ["#0f172a","#38bdf8","#f8fafc","#8b5cf6"],
    ["#052e16","#22c55e","#f0fdf4","#eab308"],
    ["#312e81","#ec4899","#fdf2f8","#22d3ee"],
    ["#7c2d12","#fb7185","#fff7ed","#facc15"]
  ];
  return {seed,palette:palettes[Math.floor(rnd()*palettes.length)],mode:Math.floor(rnd()*4)};
}
function drawArt(canvas,art){
  const ctx=canvas.getContext("2d"),size=240,r=seededRandom(art.seed);
  canvas.width=size;canvas.height=size;ctx.fillStyle=art.palette[2];ctx.fillRect(0,0,size,size);
  if(art.mode===0){
    for(let i=0;i<14;i++){ctx.beginPath();ctx.arc(r()*size,r()*size,10+r()*50,0,Math.PI*2);ctx.fillStyle=art.palette[i%4];ctx.globalAlpha=.4+r()*.5;ctx.fill()}
  }else if(art.mode===1){
    for(let i=0;i<18;i++){ctx.save();ctx.translate(r()*size,r()*size);ctx.rotate(r()*Math.PI);ctx.fillStyle=art.palette[i%4];ctx.globalAlpha=.55+r()*.35;ctx.fillRect(-45-r()*25,-8-r()*14,90+r()*50,16+r()*28);ctx.restore()}
  }else if(art.mode===2){
    ctx.translate(size/2,size/2);
    for(let i=0;i<20;i++){ctx.rotate(Math.PI/10);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(35+r()*90,-12-r()*20);ctx.lineTo(35+r()*90,12+r()*20);ctx.closePath();ctx.fillStyle=art.palette[i%4];ctx.globalAlpha=.45+r()*.45;ctx.fill()}
    ctx.setTransform(1,0,0,1,0,0);
  }else{
    for(let y=0;y<6;y++)for(let x=0;x<6;x++){ctx.fillStyle=art.palette[(x+y+Math.floor(r()*3))%4];ctx.globalAlpha=.6+r()*.35;const p=3+r()*9;ctx.fillRect(x*40+p,y*40+p,40-p*2,40-p*2)}
  }
  ctx.globalAlpha=1;
}
function syncUnlocks(){
  const shouldHave=Math.floor(xp/UNLOCK_STEP);
  while(unlockedArts.length<shouldHave){
    unlockedArts.push(createArt(Date.now()+unlockedArts.length*7919+Math.floor(Math.random()*99999)));
  }
  localStorage.setItem("unlockedArts",JSON.stringify(unlockedArts));
  renderGallery();
}
function renderGallery(){
  const g=$("gallery");g.innerHTML="";
  unlockedArts.forEach((art,i)=>{
    const card=document.createElement("div");card.className="artCard";
    const canvas=document.createElement("canvas");
    const label=document.createElement("div");label.className="artLabel";label.textContent="收藏 #"+(i+1);
    card.append(canvas,label);g.appendChild(card);drawArt(canvas,art);
  });
  const next=(Math.floor(xp/UNLOCK_STEP)+1)*UNLOCK_STEP,remain=next-xp;
  $("unlockInfo").textContent=unlockedArts.length
    ? `已收藏 ${unlockedArts.length} 張｜再獲得 ${remain} XP 解鎖下一張`
    : `再獲得 ${remain} XP，就能解鎖第一張隨機圖案！`;
}

$("listenBtn").onclick=speak;
$("showBtn").onclick=()=>{$("answer").classList.add("show");speak()};
$("nextBtn").onclick=newQuestion;
$("category").onchange=newQuestion;
$("mode").onchange=()=>{applyMode();newQuestion()};
$("checkBtn").onclick=()=>evaluate($("mode").value==="translate"?$("typed").value:recognized);
$("typed").addEventListener("keydown",e=>{if(e.key==="Enter")evaluate($("typed").value)});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
  const rec=new SpeechRecognition();
  rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{$("micBtn").textContent="🎙️ 聆聽中…";$("micBtn").disabled=true;setStatus("請直接說英文，說完後系統會自動評分。","info")};
  rec.onend=()=>{$("micBtn").textContent="🎤 開始說";$("micBtn").disabled=false};
  rec.onerror=e=>{
    setStatus(e.error==="not-allowed"?"麥克風權限被拒絕，請允許瀏覽器使用麥克風。":"沒有辨識成功，請再試一次。","warn");
  };
  rec.onresult=e=>{recognized=e.results[0][0].transcript;evaluate(recognized)};
  $("micBtn").onclick=()=>{if(questionScored){setStatus("這題已計分，請先前往下一題。","info");return}try{rec.start()}catch{}};
}else{
  $("micBtn").onclick=()=>setStatus("此瀏覽器不支援目前的語音辨識，請改用「中翻英」模式。","warn");
}

$("toggleGallery").onclick=()=>{
  const g=$("gallery"),open=!g.classList.contains("show");
  g.classList.toggle("show",open);
  $("toggleGallery").textContent=open?"收起收藏":"查看收藏";
};

updateUI();
applyMode();
syncUnlocks();
newQuestion();
</script>
</body>
